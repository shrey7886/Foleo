services:
  - type: web
    name: foleo-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend_api/requirements.txt
    startCommand: uvicorn backend_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_URL
        value: https://foleo-one.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: BROKER_TOKEN_SECRET
        generateValue: true
      - key: OAUTH_STATE_HMAC_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Secrets: Render asks for these when the Blueprint is created.
      - key: GROQ_API_KEY
        sync: false
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URL
        sync: false
      - key: ZERODHA_API_KEY
        sync: false
      - key: ZERODHA_API_SECRET
        sync: false
      - key: ZERODHA_REDIRECT_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
