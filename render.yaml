services:
  - type: web
    name: stock-mate-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend_api/requirements.txt
    startCommand: uvicorn backend_api.app:app --host 0.0.0.0 --port $PORT
    disk:
      name: stock-mate-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/backend.db
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BROKER_TOKEN_SECRET
        generateValue: true
      - key: OAUTH_STATE_HMAC_SECRET
        generateValue: true
      - key: ZERODHA_API_KEY
        sync: false
      - key: ZERODHA_API_SECRET
        sync: false
      - key: ZERODHA_REDIRECT_URL
        sync: false
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
