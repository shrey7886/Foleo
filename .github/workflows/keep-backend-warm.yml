name: Keep backend warm

# Render's free tier sleeps after ~15 min idle (30-60 s cold start, and the SQLite user store is
# reset). Pinging every 10 min keeps it awake. Limited to 03:00-18:59 UTC (08:30-00:29 IST) so the
# workspace's 750 free instance-hours/month still leave room for other services.
on:
  schedule:
    - cron: "*/10 3-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS -m 120 https://foleo-backend-ta2h.onrender.com/api/health
