name: Keep backend awake

# Render's free tier puts the backend to sleep after ~15 minutes without traffic (the next request
# then waits 30-60 s, and the SQLite user store is reset). GitHub's scheduler alone is too irregular
# to prevent that, so each run pings /api/health every 5 minutes for ~5h45m and then starts the next
# run itself. The hourly schedule restarts the chain if it ever stops.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping the backend every 5 minutes
        run: |
          end=$((SECONDS + 345 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            curl -sS -o /dev/null -w "%{http_code} in %{time_total}s\n" -m 120 \
              https://foleo-backend-ta2h.onrender.com/api/health || true
            sleep 300
          done

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-backend-warm.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
